description: GC9A01 160x160 display controller

compatible: "galaxyc,dual-gc9a01"

include: [spi-device.yaml, display-controller.yaml]

properties:
  reset-gpios:
    type: phandle-array
    description: |
      RESET pin.

      The RESET pin of GC9A01 is active low.
      If connected directly the MCU pin should be configured
      as active low.

  cmd-data-gpios:
    type: phandle-array
    description: |
      D/CX pin. If configured, 4-lines serial interface is used, otherwise
      3-lines serial interface is used and a D/CX bit (9-bit) is added to
      the protocol.

      The D/CX pin of GC9A01 is active low (transmission command byte).
      If connected directly the MCU pin should be configured
      as active low.

  two-lcd-sel-gpios:
    type: phandle-array
    description: |
      two lcd select pin.

  x-offset:
    type: int
    required: true
    description: The column offset in pixels of the LCD to the controller memory

  y-offset:
    type: int
    required: true
    description: The row offset in pixels of the LCD to the controller memory

  mdac:
    type: int
    required: true
    description: Memory Data Access Control

  colmod:
    type: int
    required: true
    description: Interface Pixel Format

